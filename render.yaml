# Render Blueprint — web + worker (Docker). Native Python also works via requirements.txt only.
services:
  - type: web
    name: repotriage-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      - key: WORKER_ENABLED
        value: "false"
      - key: WORKER_INLINE
        value: "true"
      - key: DEDICATED_WORKER
        value: "false"
      - key: AUTO_DEEP_ANALYSIS
        value: "false"
      - key: STATIC_ANALYSIS_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SEMANTIC_LLM_ENABLED
        value: "false"
      - key: SEMANTIC_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10

  - type: cron
    name: repotriage-repo-hunt
    runtime: docker
    dockerCommand: python scripts/repo_hunt_worker.py
    # every 6 hours
    schedule: "0 */6 * * *"
    plan: starter
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      - key: REPO_HUNT_ENABLED
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: VT_LIVEHUNT_RULE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REPO_HUNT_TO_EMAIL
        sync: false
      - key: REPO_HUNT_GITHUB_ORGS
        sync: false
      - key: REPO_HUNT_GITHUB_USERS
        sync: false
      - key: REPO_HUNT_WEBHOOK_SECRET
        sync: false
      - key: REPOTRIAGE_PUBLIC_URL
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10

  - type: worker
    name: repotriage-worker
    runtime: docker
    dockerCommand: python -m app.worker_main
    plan: starter
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: SEMANTIC_LLM_ENABLED
        value: "false"
      - key: SEMANTIC_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10
