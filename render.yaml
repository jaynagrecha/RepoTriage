# Render Blueprint — web + worker (Docker). Native Python also works via requirements.txt only.
#
# Tunable secrets/settings for the hunt worker use sync: false so values come from
# the Render Dashboard environment (not hardcoded in this file).
services:
  - type: web
    name: repotriage-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      - key: WORKER_ENABLED
        value: "false"
      - key: WORKER_INLINE
        value: "true"
      - key: DEDICATED_WORKER
        value: "false"
      - key: AUTO_DEEP_ANALYSIS
        value: "false"
      - key: STATIC_ANALYSIS_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SEMANTIC_LLM_ENABLED
        value: "false"
      - key: SEMANTIC_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: VT_CHILDREN_LOOKUP
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TO
        sync: false
      - key: REPOTRIAGE_PUBLIC_URL
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10

  # Always-on hunt worker — config/secrets from Render Dashboard env vars
  - type: worker
    name: repotriage-repo-hunt
    runtime: docker
    dockerCommand: python scripts/repo_hunt_worker.py
    plan: starter
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      # Set these in the Render Dashboard (Environment). Blueprint will not overwrite them.
      - key: REPO_HUNT_ENABLED
        sync: false
      - key: REPO_HUNT_LOOP
        sync: false
      - key: REPO_HUNT_INTERVAL_SECONDS
        sync: false
      - key: REPO_HUNT_WU_ENABLED
        sync: false
      - key: REPO_HUNT_REPO_WATCH_COMMITS
        sync: false
      - key: REPO_HUNT_REPO_WATCH_NEWEST_FILES
        sync: false
      - key: REPO_HUNT_WATCH_MAX_REPOS
        sync: false
      - key: REPO_HUNT_WATCH_MAX_FILES
        sync: false
      - key: REPO_HUNT_WATCH_MAX_FILE_BYTES
        sync: false
      - key: REPO_HUNT_WU_REPO_QUERIES
        sync: false
      - key: REPO_HUNT_EXTRA_SEARCH_QUERIES
        sync: false
      - key: REPO_HUNT_SEARCH_QUERY
        sync: false
      - key: REPO_HUNT_SEARCH_MAX_RESULTS
        sync: false
      - key: REPO_HUNT_MAX_CANDIDATES
        sync: false
      - key: REPO_HUNT_TO_EMAIL
        sync: false
      - key: REPO_HUNT_GITHUB_ORGS
        sync: false
      - key: REPO_HUNT_GITHUB_USERS
        sync: false
      - key: REPO_HUNT_WEBHOOK_SECRET
        sync: false
      - key: REPO_HUNT_VT_CONFIRM
        sync: false
      - key: ANALYSIS_ALERT_EMAIL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: GITLAB_BASE_URL
        sync: false
      - key: REPO_HUNT_GITLAB_SEARCH_TERMS
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: VT_LIVEHUNT_RULE_ID
        sync: false
      - key: VT_LIVEHUNT_WU_RULE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TO
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: REPOTRIAGE_PUBLIC_URL
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10

  - type: worker
    name: repotriage-worker
    runtime: docker
    dockerCommand: python -m app.worker_main
    plan: starter
    envVars:
      - key: PLATFORM_DATA_DIR
        value: /var/data
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: SEMANTIC_LLM_ENABLED
        value: "false"
      - key: SEMANTIC_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: VT_API_KEY
        sync: false
    disk:
      name: repotriage-data
      mountPath: /var/data
      sizeGB: 10
